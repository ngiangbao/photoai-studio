name: Build & Release Android APK

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradlew/gradle-wrapper.jar is committed (nothing in this repo needs it to build),
      # so Gradle itself is provisioned by this action and invoked directly below.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for release
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/PhotoAIStudio-android-alpha-001.apk

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=android-manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAIStudio-android-apk
          path: dist/PhotoAIStudio-android-alpha-001.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PhotoAI Studio Android ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/PhotoAIStudio-android-alpha-001.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
