name: Build & Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine release version from config.py
        # Lay dung APP_VERSION trong app (vd "alpha-004") de dat ten tag/release VA truyen vao
        # Inno Setup, tranh lech phien ban nhu truoc day (installer.iss co MyAppVersion rieng,
        # khong khop voi config.py). Day cung la version ma updater.py trong app se so sanh.
        id: tag
        shell: bash
        run: |
          VERSION=$(python -c "import config; print(config.APP_VERSION)")
          echo "Phien ban doc duoc: $VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify dependencies are importable
        run: |
          python -c "import PySide6; import PIL; import google.genai; print('OK: PySide6', PySide6.__version__)"

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --name "PhotoAI Studio" --windowed --onedir --icon assets\icon.ico --collect-all PySide6 main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.tag.outputs.tag }} installer.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAIStudio-Setup
          path: Output\*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PhotoAI Studio ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: Output\*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
